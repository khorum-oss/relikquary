# A hang must fail, and must say which test hung.
#
# These tests drive the app over HTTP with JDK HttpClient, which waits forever by default. When a request
# lands on a port whose Spring context has been evicted from the TestContext cache, the connect never
# completes (observed: a socket in SYN_SENT, ~30 leaked Tomcat listeners and 625 threads in one worker JVM)
# and the whole suite stops. On CI that was absorbed as a 60-minute "slow build" with no failing test — see
# hestia-systems HS-33.
#
# SEPARATE_THREAD is the load-bearing half. In the default SAME_THREAD mode a timeout is only *reported*
# after the test method returns, which never happens for a parked thread; SEPARATE_THREAD runs the method on
# its own thread and aborts it, so the suite continues and the report names the test.
junit.jupiter.execution.timeout.default = 2m
junit.jupiter.execution.timeout.thread.mode.default = SEPARATE_THREAD

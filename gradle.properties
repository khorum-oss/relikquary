org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
# org.gradle.CACHING, not org.gradle.cache: the latter is not a Gradle property and was silently ignored,
# so the build cache was off from the day this line was written. Gradle confirms either way at -i level —
# "Build cache is disabled" vs "Using local directory build cache". This matters most to CI, which runs
# --no-daemon: without the cache, every gate build starts from zero (HS-33).
org.gradle.caching=true
# Dependency verification (SHA-256 checksums) is enabled; see gradle/verification-metadata.xml.
# Signature verification is a planned future hardening (see specs/001 follow-ups).
org.gradle.dependency.verification=strict
# options: dev, stage, prod, public
dependency.env=stage
proxy.location=http://localhost:8081
